name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository at this commit
        run: |
          set -e
          git clone --no-checkout "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo
          cd repo
          git fetch origin "${{ github.sha }}"
          git checkout --detach "${{ github.sha }}"
          git log --oneline -1

      - name: Show SDK
        working-directory: repo
        run: dotnet --info

      - name: Restore
        working-directory: repo
        run: dotnet restore HydraDB.sln

      - name: Build
        working-directory: repo
        run: dotnet build HydraDB.sln -c Release --no-restore

      - name: Test
        working-directory: repo
        run: dotnet test HydraDB.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: CLI smoke
        working-directory: repo
        run: |
          printf 'create table t (id int primary key, v int)\ninsert into t values (1,10), (2,20), (3,30)\nselect count(*), sum(v) from t\n.checkpoint\n.stats\n' | dotnet run -c Release --project src/HydraDB.Cli -- ./ci-data
