name: ci

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Guard - no external NuGet packages in Core
        shell: bash
        run: |
          if grep -q "PackageReference" src/HydraDB.Core/HydraDB.Core.csproj; then
            echo "HydraDB.Core must stay dependency-free"
            exit 1
          fi

      - name: Guard - no nondeterministic Random in tests
        shell: bash
        run: |
          if grep -rn "new Random" tests/; then
            echo "tests must stay deterministic"
            exit 1
          fi

      - name: Restore
        run: dotnet restore HydraDB.sln

      - name: Build
        run: dotnet build HydraDB.sln -c Release --no-restore /warnaserror

      - name: Test
        run: dotnet test HydraDB.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  smoke:
    name: cli smoke (.stats)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run CLI and assert index stats
        shell: bash
        run: |
          set -euo pipefail
          data="$(mktemp -d)"
          printf 'create table t (id int primary key, v int)\ninsert into t values (1,10), (2,20), (3,30)\nselect count(*), sum(v) from t\n.checkpoint\n.stats\n' \
            | dotnet run -c Release --project src/HydraDB.Cli -- "$data" | tee cli.log
          grep -q "order=252" cli.log
          grep -q "crc=ok" cli.log
          grep -q "log=0B" cli.log
